<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Générateur de mot de passe</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #0d0d0f;
      color: white;
    }

    .card {
      width: 100%;
      max-width: 480px;

      padding: 32px;

      background: #17171b;

      border: 1px solid #29292f;
      border-radius: 22px;

      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 25px;
    }

    .password-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    #password {
      flex: 1;

      min-width: 0;

      padding: 14px;

      border: 1px solid #333;
      border-radius: 10px;

      background: #0e0e11;
      color: white;

      font-family: monospace;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;

      padding: 14px 18px;

      font-weight: bold;

      cursor: pointer;
    }

    .copy {
      background: #2a2a30;
      color: white;
    }

    .generate {
      width: 100%;

      margin-top: 22px;

      background: white;
      color: black;

      font-size: 15px;
    }

    .generate:hover {
      background: #ddd;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    input[type="range"] {
      width: 100%;
      margin-bottom: 25px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .option {
      background: #202025;
      padding: 12px;

      border-radius: 10px;

      font-size: 14px;
    }

    .footer {
      color: #777;
      text-align: center;

      margin-top: 20px;
      font-size: 12px;
    }

    @media (max-width: 500px) {
      .options {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<div class="card">

  <h1>🔐 Générateur de mot de passe</h1>

  <p class="subtitle">
    Créez un mot de passe aléatoire et sécurisé.
  </p>


  <div class="password-box">

    <input
      id="password"
      type="text"
      readonly
    >

    <button
      class="copy"
      onclick="copyPassword()"
    >
      Copier
    </button>

  </div>


  <div class="row">

    <span>Longueur</span>

    <strong id="lengthValue">
      16
    </strong>

  </div>


  <input
    id="length"
    type="range"
    min="4"
    max="64"
    value="16"
  >


  <div class="options">

    <label class="option">
      <input
        id="lowercase"
        type="checkbox"
        checked
      >
      Minuscules
    </label>


    <label class="option">
      <input
        id="uppercase"
        type="checkbox"
        checked
      >
      Majuscules
    </label>


    <label class="option">
      <input
        id="numbers"
        type="checkbox"
        checked
      >
      Chiffres
    </label>


    <label class="option">
      <input
        id="symbols"
        type="checkbox"
        checked
      >
      Symboles
    </label>

  </div>


  <button
    class="generate"
    onclick="generatePassword()"
  >
    Générer un mot de passe
  </button>


  <div class="footer">
    Génération effectuée directement dans votre navigateur.
  </div>

</div>


<script>

const lowercaseChars =
  "abcdefghijklmnopqrstuvwxyz";

const uppercaseChars =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

const numberChars =
  "0123456789";

const symbolChars =
  "!@#$%^&*-_=+";


const passwordInput =
  document.getElementById("password");

const lengthInput =
  document.getElementById("length");

const lengthValue =
  document.getElementById("lengthValue");


function randomNumber(max) {

  const array =
    new Uint32Array(1);

  crypto.getRandomValues(array);

  return array[0] % max;

}


function generatePassword() {

  let chars = "";

  const selectedSets = [];


  if (
    document.getElementById("lowercase").checked
  ) {

    chars += lowercaseChars;

    selectedSets.push(
      lowercaseChars
    );

  }


  if (
    document.getElementById("uppercase").checked
  ) {

    chars += uppercaseChars;

    selectedSets.push(
      uppercaseChars
    );

  }


  if (
    document.getElementById("numbers").checked
  ) {

    chars += numberChars;

    selectedSets.push(
      numberChars
    );

  }


  if (
    document.getElementById("symbols").checked
  ) {

    chars += symbolChars;

    selectedSets.push(
      symbolChars
    );

  }


  if (chars.length === 0) {

    passwordInput.value =
      "Sélectionnez une option";

    return;

  }


  const length =
    Number(lengthInput.value);


  let password = [];


  selectedSets.forEach(set => {

    password.push(
      set[
        randomNumber(set.length)
      ]
    );

  });


  while (
    password.length < length
  ) {

    password.push(
      chars[
        randomNumber(chars.length)
      ]
    );

  }


  for (
    let i = password.length - 1;
    i > 0;
    i--
  ) {

    const j =
      randomNumber(i + 1);

    [
      password[i],
      password[j]
    ] = [
      password[j],
      password[i]
    ];

  }


  passwordInput.value =
    password.join("");

}


async function copyPassword() {

  const password =
    passwordInput.value;


  if (!password) {
    return;
  }


  await navigator.clipboard.writeText(
    password
  );

}


lengthInput.addEventListener(
  "input",
  function() {

    lengthValue.textContent =
      lengthInput.value;

    generatePassword();

  }
);


document
  .querySelectorAll(
    'input[type="checkbox"]'
  )
  .forEach(input => {

    input.addEventListener(
      "change",
      generatePassword
    );

  });


generatePassword();

</script>

</body>
</html>
